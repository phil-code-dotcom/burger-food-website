<!doctype html>
<html>

<head>

<body class="bg-[#FFCDA2] overflow-x-hidden">
    <section class="max-w-[1728px] w-full mx-auto">

                </div>
                <div class="hidden lg:flex justify-between w-full max-w-[468px] list-none font-bold text-[20px] z-50">

                            <svg xmlns="http://w3.org" viewBox="0 0 24 24" class="w-[29px] h-[29px] fill-[#FF7A04]">
                                <path

                            </svg>

            <!--Right hero-->

            <div class="relative">
                <!--The burger image-->
                <img src="./assets/hero-burger-1.png" alt=""
                    class="w-full h-full max-w-[925px] max-h-[925px] translate-x-4">

                <!--the star image-->
                <div class="absolute top-15 left-15 md:w-[189px] md:h-[189px] z-40 rotate-[-15deg]">
                    <img class="absolute inset-0 w-full h-full" src="assets/Star 1.svg" alt="star">
                    <p
                        class="absolute inset-0 flex items-center justify-center text-[#FF7A04] font-poppins font-black text-[33px]/[92%] text-center">
